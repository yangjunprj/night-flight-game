<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>陽俊 Night Flight</title>

    <!-- PWA / Add to Home Screen -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#020106" />
    <link rel="icon" href="./icon-192.png" />

    <!-- iOS standalone mode (Safari ignores manifest.json, needs these) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="陽俊" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Android standalone mode -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph / link preview (Messages, Zalo, Facebook, Notes...) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yangjunprj.github.io/night-flight-game/" />
    <meta property="og:title" content="陽俊 · Night Flight — Học chữ Hán qua trò chơi bắn chữ" />
    <meta property="og:description" content="Chữ Hán rơi xuống, gõ pinyin để bắn hạ và ghi nhớ từ vựng." />
    <meta property="og:image" content="https://yangjunprj.github.io/night-flight-game/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="description" content="Chữ Hán rơi xuống, gõ pinyin để bắn hạ và ghi nhớ từ vựng." />

    <style>
      /* Fallback background so any gap below the app (dvh quirks on iOS
         standalone / home-indicator area) shows the night theme instead
         of a blank white strip. */
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #020106;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
